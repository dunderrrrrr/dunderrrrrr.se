<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Emil Björkroth</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        />
        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            :root {
                --bg: #070707;
                --fg: #dedede;
                --mid: #aaa;
                --dim: #666;
                --faint: #2a2a2a;
                --accent: #ffffff;
                --green: #39ff84;
            }

            html,
            body {
                height: 100%;
            }

            body {
                background: var(--bg);
                color: var(--fg);
                font-family: "Fira Code", monospace;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                padding: clamp(1.2rem, 4vw, 3rem);
                overflow-x: hidden;
                background-image: repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 3px,
                    rgba(255, 255, 255, 0.016) 3px,
                    rgba(255, 255, 255, 0.016) 4px
                );
            }

            body::before {
                content: "";
                position: fixed;
                inset: 0;
                pointer-events: none;
                z-index: 200;
                background:
                    radial-gradient(
                        ellipse at center,
                        transparent 50%,
                        rgba(0, 0, 0, 0.7) 100%
                    ),
                    url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.07'/%3E%3C/svg%3E");
                background-size:
                    auto,
                    180px 180px;
            }

            #matrix {
                position: fixed;
                inset: 0;
                pointer-events: none;
                z-index: 0;
                opacity: 0.07;
            }

            .page {
                position: relative;
                z-index: 1;
                display: flex;
                flex-direction: column;
                flex: 1;
            }

            /* ── header ── */
            header {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                padding-bottom: 0.6rem;
                border-bottom: 1px solid var(--dim);
                margin-bottom: clamp(1.5rem, 5vh, 3.5rem);
                flex-wrap: wrap;
                gap: 0.4rem;
                opacity: 0;
                animation: fadeIn 0.4s 0.1s forwards;
            }

            .site-id {
                font-size: clamp(0.6rem, 1.5vw, 0.75rem);
                color: var(--fg);
                letter-spacing: 0.12em;
            }

            .header-right {
                display: flex;
                align-items: center;
                gap: 0.8rem;
                font-size: 0.55rem;
                color: var(--mid);
                letter-spacing: 0.12em;
                text-transform: uppercase;
            }

            .ping {
                display: inline-flex;
                align-items: center;
                gap: 0.35rem;
            }
            .ping-dot {
                width: 0.35rem;
                height: 0.35rem;
                background: var(--green);
                border-radius: 50%;
                animation: pulse 2s ease-in-out infinite;
                box-shadow: 0 0 6px var(--green);
            }
            @keyframes pulse {
                0%,
                100% {
                    opacity: 1;
                }
                50% {
                    opacity: 0.3;
                }
            }

            /* ── identity ── */
            .identity {
                margin-bottom: clamp(1.5rem, 5vh, 3.5rem);
                opacity: 0;
                animation: fadeIn 0.4s 0.25s forwards;
            }

            .identity-name {
                font-size: clamp(1.4rem, 5vw, 2.8rem);
                font-weight: 600;
                color: var(--accent);
                letter-spacing: -0.01em;
                line-height: 1.1;
                margin-bottom: 0.5rem;
            }

            .identity-meta {
                font-size: clamp(0.58rem, 1.2vw, 0.7rem);
                color: var(--mid);
                letter-spacing: 0.1em;
            }

            .identity-meta span {
                color: var(--green);
            }

            /* ── links ── */
            .links-label {
                font-size: 0.55rem;
                color: var(--green);
                letter-spacing: 0.25em;
                text-transform: uppercase;
                margin-bottom: 0.6rem;
                opacity: 0;
                animation: fadeIn 0.4s 0.4s forwards;
            }

            .links {
                display: grid;
                grid-template-columns: repeat(
                    auto-fill,
                    minmax(min(200px, 45%), 1fr)
                );
                gap: 0.5rem;
                margin-bottom: clamp(1.5rem, 5vh, 3.5rem);
                opacity: 0;
                animation: fadeIn 0.4s 0.5s forwards;
            }

            .link-item {
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                gap: 1.4rem;
                padding: 1.1rem 1.1rem 0.9rem;
                text-decoration: none;
                font-family: "Fira Code", monospace;
                border: 1px solid var(--faint);
                border-left: 2px solid var(--dim);
                position: relative;
                overflow: hidden;
                transition:
                    border-color 0.18s,
                    border-left-color 0.18s;
                background: rgba(255, 255, 255, 0.018);
            }

            .link-item::before {
                content: "";
                position: absolute;
                inset: 0;
                background: var(--green);
                transform: translateY(101%);
                transition: transform 0.24s cubic-bezier(0.16, 1, 0.3, 1);
                z-index: 0;
            }
            .link-item:hover::before {
                transform: translateY(0);
            }
            .link-item:hover {
                border-color: var(--green);
                border-left-color: var(--green);
            }
            .link-item:hover .li-icon,
            .link-item:hover .li-name,
            .link-item:hover .li-sub,
            .link-item:hover .li-arrow {
                color: var(--bg);
            }

            .link-item > * {
                position: relative;
                z-index: 1;
            }

            .li-top {
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
            }

            .li-icon {
                font-size: 1.2rem;
                color: var(--mid);
                line-height: 1;
                transition: color 0.15s;
            }

            .li-arrow {
                font-size: 0.55rem;
                color: var(--dim);
                line-height: 1;
                transition:
                    color 0.15s,
                    transform 0.18s ease;
            }
            .link-item:hover .li-arrow {
                transform: translate(3px, -3px);
            }

            .li-bottom {
                display: flex;
                flex-direction: column;
                gap: 0.18rem;
                min-width: 0;
            }

            .li-name {
                font-size: 0.7rem;
                font-weight: 500;
                letter-spacing: 0.08em;
                color: var(--fg);
                transition: color 0.15s;
            }

            .li-sub {
                font-size: 0.5rem;
                color: var(--dim);
                letter-spacing: 0.05em;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                transition: color 0.15s;
            }

            /* ── access log ── */
            .log-wrap {
                flex: 1;
                display: flex;
                flex-direction: column;
                justify-content: flex-end;
                min-height: 0;
            }

            .access-log {
                font-size: 0.55rem;
                color: var(--dim);
                line-height: 1.8;
                height: clamp(4rem, 15vh, 8rem);
                overflow: hidden;
                position: relative;
            }
            .access-log::after {
                content: "";
                position: absolute;
                bottom: 0;
                left: 0;
                right: 0;
                height: 2.5rem;
                background: linear-gradient(to bottom, transparent, var(--bg));
                pointer-events: none;
            }
            .log-time {
                color: var(--mid);
            }
            .log-ok {
                color: #39ff84;
                opacity: 0.5;
            }
            .log-warn {
                color: #aaa;
            }
            .log-err {
                color: #888;
            }
            .log-ip {
                color: var(--mid);
            }

            /* ── footer ── */
            footer {
                padding-top: 0.6rem;
                border-top: 1px solid var(--faint);
                display: flex;
                justify-content: space-between;
                flex-wrap: wrap;
                gap: 0.4rem;
                font-size: 0.52rem;
                color: var(--dim);
                letter-spacing: 0.12em;
                text-transform: uppercase;
                margin-top: 0.6rem;
            }

            .footer-r {
                font-variant-numeric: tabular-nums;
            }

            @keyframes fadeIn {
                to {
                    opacity: 1;
                }
            }

            /* ── scanline flicker ── */
            @keyframes flicker {
                0%,
                100% {
                    opacity: 1;
                }
                92% {
                    opacity: 1;
                }
                93% {
                    opacity: 0.85;
                }
                94% {
                    opacity: 1;
                }
                96% {
                    opacity: 0.9;
                }
                97% {
                    opacity: 1;
                }
            }
            .page {
                animation: flicker 8s infinite;
            }

            /* ── glitch on name ── */
            .identity-name {
                position: relative;
            }
            .identity-name::before {
                content: attr(data-text);
                position: absolute;
                inset: 0;
                color: var(--green);
                clip-path: var(--ghost-clip, polygon(0 0, 100% 0, 100% 0, 0 0));
                transform: translateX(var(--ghost-dx, 0px));
                opacity: 0.75;
                pointer-events: none;
            }

            /* ── cursor blink on section labels ── */
            .links-label::after {
                content: "_";
                animation: blink-cur 1s step-end infinite;
                color: var(--green);
                margin-left: 1px;
            }
            @keyframes blink-cur {
                0%,
                100% {
                    opacity: 1;
                }
                50% {
                    opacity: 0;
                }
            }

            /* ── card: subtle green glow on hover ── */
            .link-item:hover {
                box-shadow:
                    0 0 12px rgba(57, 255, 132, 0.12),
                    inset 0 0 20px rgba(57, 255, 132, 0.04);
            }

            /* ── header border green pulse ── */
            header {
                border-bottom-color: var(--faint);
                animation:
                    fadeIn 0.4s 0.1s forwards,
                    border-pulse 4s 1s ease-in-out infinite;
            }
            @keyframes border-pulse {
                0%,
                100% {
                    border-bottom-color: var(--faint);
                }
                50% {
                    border-bottom-color: rgba(57, 255, 132, 0.25);
                }
            }

            @media (max-width: 480px) {
                .identity-name {
                    font-size: clamp(1.2rem, 8vw, 1.8rem);
                }
                .links {
                    grid-template-columns: 1fr 1fr;
                }
                .li-sub {
                    display: none;
                }
                footer {
                    flex-direction: column;
                }
            }
        </style>
    </head>
    <body>
        <canvas id="matrix"></canvas>
        <div class="page">
            <header>
                <span class="site-id">dunderrrrrr.se</span>
                <div class="header-right">
                    <span class="ping"
                        ><span class="ping-dot"></span>online</span
                    >
                    <span id="topbar-ts"></span>
                </div>
            </header>

            <div class="identity">
                <div class="identity-name" data-text="Emil Björkroth">
                    Emil<br />Björkroth
                </div>
                <div class="identity-meta">developer / <span>sweden</span></div>
            </div>

            <div class="links-label">// social</div>
            <div class="links" id="links-social"></div>

            <div class="links-label">// projects</div>
            <div class="links" id="links-projects"></div>

            <div class="log-wrap">
                <div class="access-log" id="access-log"></div>
            </div>

            <footer>
                <span>ssh-ed25519 · tls 1.3 · aes-256-gcm</span>
                <span class="footer-r" id="ts"></span>
            </footer>
        </div>

        <script>
            (() => {
                const pad = (n) => String(n).padStart(2, "0");

                // clock
                const tick = () => {
                    const d = new Date();
                    const s = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
                    document.getElementById("ts").textContent = s;
                    document.getElementById("topbar-ts").textContent = s;
                };
                tick();
                setInterval(tick, 1000);

                // links
                const social = [
                    {
                        name: "github",
                        icon: "fab fa-github",
                        sub: "github.com/dunderrrrrr",
                        url: "https://github.com/dunderrrrrr",
                    },
                    {
                        name: "deltachat",
                        icon: "fas fa-commenting",
                        sub: "encrypted p2p",
                        url: "https://i.delta.chat/#8D4471513633B127A7F39BACA8460BF48508220E&a=z0p7bjovj%40nine.testrun.org&n=dunderrrrrr&i=vjTbIOUIDGUsZd5t3nj7nyZp&s=pLxXoPFep4G6-9YfWAO5t_uW",
                    },
                    {
                        name: "email",
                        icon: "fas fa-envelope",
                        sub: "protonmail",
                        url: "mailto:emil[dot]bjorkroth[at]proton[dot]me",
                    },
                    {
                        name: "linkedin",
                        icon: "fab fa-linkedin",
                        sub: "in/emil-bjorkroth",
                        url: "https://www.linkedin.com/in/emil-bjorkroth/",
                    },
                ];
                const projects = [
                    {
                        name: "brygglogg",
                        icon: "fas fa-beer",
                        sub: "homebrewing log",
                        url: "https://brygglogg.dunderrrrrr.se",
                    },
                    {
                        name: "blocket_api",
                        icon: "fas fa-car",
                        sub:"python wrapper and api",
                        url: "https://blocket-api.se",
                    },
                    {
                        name: "chat.rosamjolk.se",
                        icon: "fas fa-cow",
                        sub: "deltachat relay",
                        url: "https://chat.rosamjolk.se",
                    },
                    {
                        name: "domänfluff",
                        icon: "fas fa-tag",
                        sub: "domain finder",
                        url: "https://domänfluff.dunderrrrrr.se",
                    },
                    {
                        name: "tågpuls",
                        icon: "fas fa-subway",
                        sub: "transit tracker",
                        url: "https://tagpuls.dunderrrrrr.se",
                    },
                    {
                        name: "swarje",
                        icon: "fas fa-globe",
                        sub: "swedish word game",
                        url: "https://swarje.dunderrrrrr.se",
                    },
                    {
                        name: "städer",
                        icon: "fas fa-map-marker",
                        sub: "city guessing",
                        url: "https://staeder.dunderrrrrr.se",
                    },
                    {
                        name: "wcwp",
                        icon: "fab fa-steam",
                        sub: "steam game finder",
                        url: "https://wcwp.dunderrrrrr.se",
                    },
                ];
                const makeCard = ({ name, icon, sub, url }) => {
                    const a = document.createElement("a");
                    a.href = url;
                    if (!url.startsWith("mailto")) a.target = "_blank";
                    a.className = "link-item";
                    a.innerHTML = `<div class="li-top"><i class="${icon} li-icon"></i><span class="li-arrow">↗</span></div><div class="li-bottom"><span class="li-name" data-text="${name}">${name}</span><span class="li-sub">${sub}</span></div>`;
                    return a;
                };
                const socialOut = document.getElementById("links-social");
                const projectsOut = document.getElementById("links-projects");
                social.forEach((l) => socialOut.appendChild(makeCard(l)));
                projects.forEach((l) => projectsOut.appendChild(makeCard(l)));

                // access log
                const logEl = document.getElementById("access-log");
                const ips = [
                    "185.220.101.47",
                    "94.102.49.190",
                    "45.33.32.156",
                    "198.199.78.32",
                    "77.91.68.14",
                    "103.21.244.0",
                    "162.158.92.11",
                    "23.229.117.26",
                ];
                const paths = [
                    "/etc/passwd",
                    "/.env",
                    "/.git/config",
                    "/wp-admin",
                    "/admin",
                    "/config.php",
                    "/api/v1/users",
                    "/shell.php",
                    "/.ssh/id_rsa",
                    "/phpmyadmin",
                    "/backup.sql",
                    "/xmlrpc.php",
                ];
                const ts = () => `[${new Date().toISOString().slice(11, 19)}]`;
                const rip = () => ips[(Math.random() * ips.length) | 0];
                const rpath = () => paths[(Math.random() * paths.length) | 0];
                const p = (s, n) => s.padEnd(n);
                const templates = [
                    () =>
                        `<span class="log-time">${ts()}</span> <span class="log-err">BLOCKED</span> <span class="log-ip">${p(rip(), 16)}</span> GET ${rpath()} 403`,
                    () =>
                        `<span class="log-time">${ts()}</span> <span class="log-warn">PROBE  </span> <span class="log-ip">${p(rip(), 16)}</span> SYN scan detected`,
                    () =>
                        `<span class="log-time">${ts()}</span> <span class="log-ok">ALLOW  </span> <span class="log-ip">${p("127.0.0.1", 16)}</span> GET / 200`,
                    () =>
                        `<span class="log-time">${ts()}</span> <span class="log-err">BLOCKED</span> <span class="log-ip">${p(rip(), 16)}</span> POST /login 429`,
                    () =>
                        `<span class="log-time">${ts()}</span> <span class="log-warn">PROBE  </span> <span class="log-ip">${p(rip(), 16)}</span> UDP flood attempt`,
                    () =>
                        `<span class="log-time">${ts()}</span> <span class="log-err">BLOCKED</span> <span class="log-ip">${p(rip(), 16)}</span> GET ${rpath()} 404`,
                    () =>
                        `<span class="log-time">${ts()}</span> <span class="log-warn">PROBE  </span> <span class="log-ip">${p(rip(), 16)}</span> banner grab :22`,
                    () =>
                        `<span class="log-time">${ts()}</span> <span class="log-err">BLOCKED</span> <span class="log-ip">${p(rip(), 16)}</span> SQL injection attempt`,
                    () =>
                        `<span class="log-time">${ts()}</span> <span class="log-err">BLOCKED</span> <span class="log-ip">${p(rip(), 16)}</span> directory traversal`,
                ];
                const addLog = () => {
                    const div = document.createElement("div");
                    div.innerHTML =
                        templates[(Math.random() * templates.length) | 0]();
                    logEl.appendChild(div);
                    while (logEl.children.length > 20)
                        logEl.firstChild.remove();
                    setTimeout(addLog, 300 + Math.random() * 600);
                };
                addLog();

                // name glitch
                (() => {
                    const el = document.querySelector(".identity-name");
                    const ghost = el.querySelector ? null : null;
                    const r = (min, max) => Math.random() * (max - min) + min;
                    const ri = (min, max) => r(min, max) | 0;

                    const glitch = () => {
                        const slices = ri(1, 4);
                        const frames = [];
                        for (let s = 0; s < slices; s++) {
                            const y1 = ri(0, 90);
                            const y2 = y1 + ri(4, 20);
                            const dx = ri(-6, 6) || 2;
                            frames.push({ y1, y2, dx });
                        }

                        let f = 0;
                        const step = () => {
                            if (f >= frames.length) {
                                el.style.transform = "";
                                el.style.clipPath = "";
                                el.style.setProperty(
                                    "--ghost-clip",
                                    "polygon(0 0,100% 0,100% 0,0 0)",
                                );
                                el.style.setProperty("--ghost-dx", "0px");
                                scheduleNext();
                                return;
                            }
                            const { y1, y2, dx } = frames[f++];
                            el.style.transform = `translateX(${-dx * 0.5}px)`;
                            el.style.setProperty(
                                "--ghost-clip",
                                `polygon(0 ${y1}%,100% ${y1}%,100% ${y2}%,0 ${y2}%)`,
                            );
                            el.style.setProperty("--ghost-dx", `${dx}px`);
                            setTimeout(step, ri(40, 100));
                        };
                        step();
                    };

                    const scheduleNext = () =>
                        setTimeout(glitch, ri(600, 3000));
                    scheduleNext();
                })();

                // matrix rain
                const canvas = document.getElementById("matrix");
                const ctx = canvas.getContext("2d");
                const resize = () => {
                    canvas.width = innerWidth;
                    canvas.height = innerHeight;
                };
                resize();
                window.addEventListener("resize", resize);
                let drops = [];
                const initDrops = () => {
                    drops = Array.from(
                        { length: Math.floor(canvas.width / 14) },
                        () => (Math.random() * -50) | 0,
                    );
                };
                initDrops();
                window.addEventListener("resize", initDrops);
                const chars =
                    "アイウエオカキクケコサシスセソタチツテトナニヌネノ01";
                setInterval(() => {
                    ctx.fillStyle = "rgba(7,7,7,0.18)";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = "#39ff84";
                    ctx.font = '12px "Fira Code", monospace';
                    drops.forEach((y, i) => {
                        ctx.fillText(
                            chars[(Math.random() * chars.length) | 0],
                            i * 14,
                            y * 14,
                        );
                        if (y * 14 > canvas.height && Math.random() > 0.975)
                            drops[i] = 0;
                        drops[i]++;
                    });
                }, 55);
            })();
        </script>

            type="module"

</html>
